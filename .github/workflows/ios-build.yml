name: iOS build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Generate clean iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build iOS release
        run: xcodebuild -workspace ios/brainlyalarmexpo.xcworkspace -scheme brainlyalarmexpo -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS app bundle
        run: test -d ios/DerivedData/Build/Products/Release-iphonesimulator/brainlyalarmexpo.app
